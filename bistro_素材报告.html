function drawSub(){
  const scopeBits = [];
  if (D.meta.packages.length) scopeBits.push('包名 <code>' + D.meta.packages.map(esc).join('</code> <code>') + '</code>');
  else scopeBits.push('<b>不按包名筛选</b>(金额是该素材在全账户的花费)');
  if (D.meta.nameTokens.length) scopeBits.push('素材名含 <code>' + D.meta.nameTokens.map(esc).join('</code> 或 <code>') + '</code>');
  if (D.meta.onlyNoPkg) scopeBits.push('<b>仅未关联包名(Associated Packages 为空)的素材</b>');
  if (D.mergedDiff && D.mergedDiff.count) scopeBits.push(
    '另并入 <b>'+D.mergedDiff.count+' 条差值素材</b>(金额=它们在其它 App 上的花费,表格里带「差值·其它App」徽章)');

  document.getElementById('sub').innerHTML =
    '数据日期(UTC) <code>' + (D.latest||'-') + '</code>' +
    (D.prev ? ' · 对比 <code>' + D.prev + '</code>' : ' · <b>首次记录,暂无对比</b>') +
    ' · 素材类型 <code>' + esc(D.meta.resourceType) + '</code>' +
    ' · 生成于 ' + esc(D.meta.generatedAt) +
    '<br>筛选口径:' + scopeBits.join(' · ');
}

      + '<br><br>那天程序没跑成(比如电脑没开)。用「近7天合计」的差分反推出来的 —— '
      + '数学上是<b>恒等式</b>(近7天之差 = 当天 − 滚出窗口那天),只要 AppLovin 没事后改数就是精确值。'
      + '<br>折线图上这些日子画成<b>虚线 + 空心点</b>、X 轴标「估」、背景有淡色底,鼠标悬停也会标「估算值」。'
      + '<br>CSV 里 <code>数据来源</code> 列 = <code>估算</code>,用 Excel 筛选一下就能只看实测数据。');
  }
  if (D.missingDates.length) {
    w.push('<b>⚠ 有 ' + D.missingDates.length + ' 天既没抓到、也反推不出来:</b> '
      + D.missingDates.map(d=>'<code>'+d+'</code>').join(' ')
      + '<br>折线图上这些日子画成<b>断口</b>并标了「缺」,不会连成直线假装有数据。'
      + '<br>反推需要缺口两侧都有「近7天」数据 —— 连续缺 7 天以上时,最早那两天就凑不出恒等式了。'
      + '详见「使用说明.md」第 1.6 节。');
  }
  if (D.latest && D.prev && !D.prevIsAdjacent) {
    w.push('<b>注意:「变化」列不是日环比。</b> 因为 ' + D.prev + ' 之后有缺失,'
      + '当前对比的是 <code>' + D.latest + '</code> 与 <code>' + D.prev + '</code>,中间隔了几天。');
  }
  if (D.mergedDiff && D.mergedDiff.baselineGap && !D.mergedDiff.hasPrev) {
    w.push('<b>⚠ 涨跌对比暂时不可比,已隐去百分比。</b><br>'
      + '并入的 <b>'+D.mergedDiff.count+' 条差值素材</b>从 <code>'+D.mergedDiff.firstDate+'</code> 才开始有数据,'
      + '而对比基准日 <code>'+D.prev+'</code> 那天还没有。'
      + '<br>也就是说:今天的合计里含 '+money(D.mergedDiff.spend)+' 的差值花费,昨天的合计里没有 —— '
      + '直接相比会得出一个<b>虚假的暴涨</b>,所以我把百分比隐藏了。'
      + '<br>再跑一天(两边都有数据)之后就自动恢复正常对比。');
  }
  if (D.meta.criterionChangeDate && D.latest === D.meta.criterionChangeDate && D.prev) {
    w.push('<b>⚠ 今天的「变化 / 涨跌 / 新增 / 归零」跨了一次筛选口径变更,不能当成真实涨跌看。</b><br>'
      + '<code>'+esc(D.meta.criterionChangeDate)+'</code> 这天起换了筛选条件,而对比基准日 '
      + '<code>'+D.prev+'</code> 的数据还是<b>按老口径</b>抓的 —— 两边装的不是同一批素材。'
      + (D.meta.criterionChangeNote ? '<br>'+esc(D.meta.criterionChangeNote) : '')
      + '<br>只有「和前一天比」的那几个数字受影响:<b>昨日总花费、近7天总花费、每条素材的金额本身都是准的</b>。'
      + '<br>再跑一天(前后两天都是新口径)之后,这条提示会自动消失、涨跌也自动恢复正常。');

      + '<code>' + D.prev + '</code> 这天是反推出来的,所以涨跌百分比也带着估算的性质。');

  document.getElementById('warn').innerHTML = w.map(t=>'<div class="warn">'+t+'</div>').join('');

const winLab = (arr) => (arr && arr.length) ? arr[0].slice(5)+' ~ '+arr[arr.length-1].slice(5) : '—';

/* 日均单元格:窗口里没用满三天时把「用了几天」标出来,不能让人以为是完整的三天日均 */
function avgCell(v, used){
  if (v===null || v===undefined) return dashSpan;
  const nd = (D.mv&&D.mv.winDays)||3;
  return money(v) + ((used!==undefined && used!==null && used<nd)
    ? '<span class="badge" title="这三天里只有 '+used+' 天抓到了数据,日均是按 '+used+' 天算的">'+used+'/'+nd+'天</span>' : '');
}
/* mk==='new' = 上一轮三天一分钱没花、这三天花了 —— 算不出百分比(除以 0),
   所以给个词。注意这里说的是「钱从 0 起来的」,不一定是新上传的素材:
   老素材停投一阵又重新开投也长这样,所以不能写「新素材」。 */
const mvCell = (o) => o.mk==='new'
  ? '<span class="up" title="上一轮那三天没有花费,算不出百分比。可能是新素材首次起量,也可能是老素材停投后重新开投">从 0 起量</span>'
  : ((o.mv===null||o.mv===undefined) ? dashSpan : deltaHtml(o.mv));
const freshBadge = (age) => (age!==null&&age!==undefined&&age<NA.days)
  ? '<span class="badge" style="border-color:var(--s3);color:var(--s3)">新 '+age+'天</span>' : '';

function mvRuleText(){
  const R = D.mv;
  return '<b>门槛</b>:昨日 spend 超过 <b>'+money(R.floorNew)+'</b>(近 '+R.newDays+' 天上传)'
    + ' / <b>'+money(R.floorOld)+'</b>(更早上传,或上传时间未知)。'
    + '<br><b>涨跌</b>:<b>'+winLab(R.winA)+'</b> 三天日均 与 <b>'+winLab(R.winB)+'</b> 三天日均相比,'
    + '涨跌 <b>≥ '+R.thr+'%</b>。'
    + (R.freshUpOnly ? '近 '+R.newDays+' 天上传的素材<b>只看增长、不看下跌</b>。' : '')
    + '<br><span style="color:var(--muted)">昨日的金额只用来卡门槛,不参与涨跌计算。'
    + '窗口里整天没抓到数据的日子不参与日均(分母也少 1),一个窗口至少要有 '+R.minWinDays+' 天有效数据才判定。</span>';
}

function mvFreezeText(){
  const M = MVR;
  const bits = ['本次名单刷新于 <b>'+M.refreshedLabel+'</b>(依据数据日 <code>'+(M.dataDate||'-')+'</code>)'
    + ' · 下次刷新 <b>'+M.nextLabel+'</b>'];
  /* refreshDaysLabel 本身已经带「周」字(例:周二、周五),前面只能加「每」,
     写成 '每周'+label 会变成「每周周二、周五」。 */
  bits.push('金额数字每天都更新,<b>名单和表格底色每'+M.refreshDaysLabel+'各换一次</b>。');
  if (M.reason==='first') bits.push('<span style="color:var(--muted)">(这是第一份名单,按今天的数据定的。)</span>');
  if (M.reason==='rule') bits.push('<span style="color:var(--muted)">(配置里的门槛/阈值改过了,已按新规则重新判定。)</span>');
  if (M.missedRefresh) bits.push('<span style="color:var(--muted)">(上一个刷新日 '+M.missedRefresh+' 那天没生成报告,今天补刷了一次。)</span>');
  return bits.join('<br>');
}

/* 冻结带来的不一致必须自己说出来,别等用户当成 bug */
function mvStaleNote(){
  const M = MVR, out = [];
  if (M.dataDateStale) out.push('⚠ 名单里的金额是 <code>'+M.dataDate+'</code> 那天判定时的数字;'
    + '下面「素材明细」表里的金额已经是最新的 <code>'+(D.latest||'-')+'</code>,两者会不一样,'
    + '底色也可能和「变化」列当天的箭头不一致 —— 这就是「名单只在每'+M.refreshDaysLabel+'更新」的代价。');
  if (M.frozen && (M.liveCount.up!==M.count.up || M.liveCount.down!==M.count.down))
    out.push('按<b>今天最新数据</b>重算的话会是 <span class="up">'+M.liveCount.up+' 条增长</span> / '
      + '<span class="down">'+M.liveCount.down+' 条下跌</span>(仅供参考,名单要等到 '+M.nextLabel+' 才换)。');
  const R = D.mv;
  const miss = [...(R.missA||[]), ...(R.missB||[])];
  const est = [...(R.estA||[]), ...(R.estB||[])];
  if (miss.length) out.push('⚠ 两个窗口里有 '+miss.length+' 天没抓到数据('+miss.join('、')+'),'
    + '这些天不参与日均;缺得太多的素材干脆不判定。');
  if (est.length) out.push('窗口里有 '+est.length+' 天是<b>反推的估算值</b>('+est.join('、')+'),日均因此带估算性质。');
  const gone = MVR.items.filter(it=>!AMAP.has(String(it.id))).length;
  if (gone) out.push('名单里有 '+gone+' 条素材在今天的数据里已经不见了(下架或改名),'
    + '它们的数字保留判定当天的值,趋势图为空。');
  return out.length ? '<div class="mvnote">'+out.join('<br>')+'</div>' : '';
}

function mvTable(items, dir){
  if (!items.length) return '<div class="none">本轮没有素材达到门槛。</div>';
  const cls = dir==='up' ? 'mup' : 'mdn';
  return '<div class="tblwrap"><table><thead><tr>'
    + '<th>#</th><th class="nm">素材名</th><th>上传日期</th><th>昨日 spend</th>'
    + '<th>前三天日均<br><span style="font-weight:400;color:var(--muted)">'+winLab(D.mv.winA)+'</span></th>'
    + '<th>上一轮三天日均<br><span style="font-weight:400;color:var(--muted)">'+winLab(D.mv.winB)+'</span></th>'
    + '<th>变化</th>'
    + (SV.available?'<th>近7天 spend</th>':'')
    + '<th>展示量</th><th>点击</th><th>CTR</th><th>趋势</th></tr></thead><tbody>'
    + items.map((it,i)=>'<tr class="'+cls+'">'
      + '<td>'+(i+1)+'</td>'
      + '<td class="nm">'+esc(it.name)
        + (it.src==='差值'?'<span class="badge" style="border-color:var(--s2);color:var(--s2)" title="这一行的金额是「该素材在其它 App 上的花费」">差值·其它App</span>':'')
        + (it.status&&it.status!=='ACTIVE'?'<span class="badge">'+esc(it.status)+'</span>':'')+'</td>'
      + '<td class="n" style="color:var(--ink2)">'+(it.up||'—')+freshBadge(it.age)+'</td>'
      + '<td class="n">'+money(it.spend||0)+'</td>'
      + '<td class="n">'+avgCell(it.a3,it.ua)+'</td>'
      + '<td class="n" style="color:var(--ink2)">'+avgCell(it.b3,it.ub)+'</td>'
      + '<td class="n">'+mvCell(it)+'</td>'
      + (SV.available?'<td class="n">'+((it.spend7===null||it.spend7===undefined)?dashSpan:money(it.spend7))+'</td>':'')
      + '<td class="n">'+intf(it.imp||0)+'</td><td class="n">'+intf(it.clk||0)+'</td>'
      + '<td class="n">'+(it.ctr||0).toFixed(2)+'%</td>'
      + '<td>'+(AMAP.has(String(it.id))?spark(AMAP.get(String(it.id))):'')+'</td></tr>').join('')
    + '</tbody></table></div>';
}

function drawMovers(){
  const el = document.getElementById('movers');
  if (!MVR || !D.mv) { el.innerHTML=''; return; }
  const ups = MVR.items.filter(it=>it.dir==='up');
  const dns = MVR.items.filter(it=>it.dir==='down');

    + '<h2>涨跌素材 <span style="font-weight:400;color:var(--muted);font-size:13px">'
    + '· 每'+MVR.refreshDaysLabel+'刷新一次名单</span></h2>'
    + '<p class="hint" style="margin-bottom:10px">'+mvRuleText()+'</p>'
    + '<p class="hint" style="margin-bottom:0">'+mvFreezeText()+'</p>'

    + '<div class="mvgrp"><h3><span class="up">▲ 快速增长 '+ups.length+' 条</span></h3>'+mvTable(ups,'up')+'</div>'
    + '<div class="mvgrp"><h3><span class="down">▼ 严重下跌 '+dns.length+' 条</span></h3>'+mvTable(dns,'down')+'</div>'
    + '</div>';
}

/* ---------- 上传日期筛选(同时作用于折线图和表格) ---------- */
let fkey = 'all';
const curFilter = () => (FILTERS.find(f=>f[0]===fkey)||FILTERS[0])[2];
const scoped = () => D.assets.filter(curFilter());

function drawFbar(){
  document.getElementById('fbtns').innerHTML = FILTERS.map(([k,lab])=>

  const sc = scoped();

    + (fkey!=='all' ? ' · 占大盘 '+(S.totalSpend>0?(sp/S.totalSpend*100).toFixed(1):'0')+'%' : '');

/* ---------- 纵轴指标:昨日单日 / 近7天滚动合计 ---------- */
/* short 是单独一个字段,不要用正则从 label 里裁掉括号部分。
   原因:这段脚本是 Node 模板字符串拼出来的,源码里的反斜杠会被吞掉,
   于是「转义过的左括号」到了页面上就变成了普通左括号,
   正则从「匹配一对括号及其内容」退化成「匹配任意字符串」,会把整个标题清空。
   教训:这段模板里凡是要写反斜杠,都必须写两个;能不用反斜杠就别用。 */
const METRICS = {
  day:  { key:'s', label:'昨日 spend(逐日)',     short:'昨日 spend',  sortKey:'spend',  tip:'当日 spend' },
  week: { key:'w', label:'近7天 spend(滚动合计)', short:'近7天 spend', sortKey:'spend7', tip:'近7天 spend' },
};
let metric = 'day';
const M = () => METRICS[metric];
const valsOf = (a) => a[M().key] || [];

function drawMbar(){
  const bar = document.getElementById('mbar');
  if (!SV.available) { bar.innerHTML=''; return; }   // 没抓近7天就不显示切换
  bar.innerHTML = '<span class="mode">纵轴指标</span>'
    + Object.entries(METRICS).map(([k,v]) =>
        '<button data-m="'+k+'" class="'+(k===metric?'on':'')+'" style="border-radius:999px;padding:5px 13px;font-size:13px'
        + (k===metric?';background:var(--s1);border-color:var(--s1);color:#fff;font-weight:600':'')+'">'+v.label+'</button>').join(' ');
  bar.querySelectorAll('button').forEach(b=>b.onclick=()=>{
    metric = b.dataset.m;
    topAssets = computeTop();          // 换指标 → 自动模式的 Top10 也要按新指标重排
    drawMbar(); drawHint(); drawLegend(); drawChart();
  });
}

/* ---------- 折线图:系列选择 ---------- */
/* 注意:变量名不能叫 top —— window.top 是浏览器内置全局,重名会让整段脚本报错 */
const hidden = new Set();
const MAXSER = SER.length;            // 10 —— 上限就是通过验证的颜色数,不能超
/* localStorage key 要按「哪一份报表 + 哪一套数据」分开。
   ⚠ file:// 下所有本地 html 共用同一个 localStorage 源,所以两份报表会撞 key;
   而 loadPicked() 会把「不在当前数据集里的 ID」清掉并存回去 —— 两份报表素材零重叠,
   撞 key 就等于「打开另一份报表会把这一份勾好的清空」。所以必须带上工作目录。
   主报表的视频那套保持原来的裸 key,你以前勾好的选择不会因为升级丢掉。 */
const LSSCOPE = (function(){
  const w = String((DSETS.video.meta.dataDir || 'data')).split('/')[0];
  return w === 'data' ? '' : '-' + w;
})();
const lskey = () => 'applovin-report-picked-series' + LSSCOPE + (dsKey==='video' ? '' : '-'+dsKey);

/* picked: 素材ID -> 颜色槽位(0..7)。
   用「固定槽位」而不是按花费排序取色 —— 否则增删一条会把其它线的颜色全部洗牌,
   你昨天记住的「蓝色那条」今天就变成别的素材了。 */
let picked = new Map();
const savePicked = () => { try { localStorage.setItem(lskey(), JSON.stringify([...picked])); } catch (e) {} };

/* 页面初始化和每次切换数据集都要重读一遍。
   报告每天重新生成,已删掉的素材顺手清掉,否则槽位被占着不放 */
function loadPicked(){
  picked = new Map();
  try {
    const v = JSON.parse(localStorage.getItem(lskey()) || '[]');
    if (Array.isArray(v)) for (const it of v) if (Array.isArray(it) && it.length === 2) picked.set(String(it[0]), Number(it[1]));
  } catch (e) {}
  const alive = new Set(D.assets.map(a=>a.id));
  let changed = false;
  for (const id of [...picked.keys()]) if (!alive.has(id)) { picked.delete(id); changed = true; }
  if (changed) savePicked();
}

const manualMode = () => picked.size > 0;
function addPick(id){
  if (picked.has(id)) return true;
  if (picked.size >= MAXSER) return false;
  const used = new Set(picked.values());
  let slot = 0; while (used.has(slot)) slot++;
  picked.set(id, slot); savePicked(); return true;
}
const removePick = (id) => { picked.delete(id); savePicked(); };

function computeTop(){
  if (manualMode()){
    const byId = new Map(D.assets.map(a=>[a.id,a]));
    return [...picked.keys()].map(id=>byId.get(id)).filter(Boolean)
      .sort((x,y)=>picked.get(x.id)-picked.get(y.id));       // 按槽位排,颜色才稳定
  }
  const sk = M().sortKey;
  return scoped().filter(a=>(a[sk]||0)>0).sort((x,y)=>(y[sk]||0)-(x[sk]||0)).slice(0,MAXSER);
}
let topAssets = [];        // 真正的初值由 useDataset() 算(它跑在所有变量都就位之后)

/* 取色:手动模式看固定槽位,自动模式看名次 */
const slotOf = (a) => manualMode() ? (picked.get(a.id) || 0) : topAssets.indexOf(a);
const slotIdx = (a) => ((slotOf(a) % SER.length) + SER.length) % SER.length;
const varOf  = (a) => 'var(' + SER[slotIdx(a)] + ')';
const colorOf = (a) => cssv(SER[slotIdx(a)]);

function drawHint(){
  document.getElementById('charttitle').textContent = M().short + ' 趋势' +
    (manualMode() ? '(你手动选的 '+topAssets.length+' 条)'
      : (fkey==='all' ? '(该指标下最高的 '+MAXSER+' 条素材)' : '(所选上传范围内该指标最高的 '+MAXSER+' 条)'));
  const hint = document.getElementById('charthint');
  const pts = D.dates.filter((d,i)=> topAssets.some(a=>valsOf(a)[i]!==null)).length;
  if (metric==='week') {
    hint.innerHTML = '每个点 = <b>截止那天的 7 天总额</b>(不是那一天的花费)。'
      + '这条线把单日波动抹平了,更容易看出真实的上升 / 衰退趋势。'
      + (pts < 2 ? ' <b>⚠ 目前只有 '+pts+' 个数据点</b> —— 每天运行一次,攒够 2 天就会连成线。' : '')
      + ' AppLovin 只给「近7天总额」这一个数、不给 7 天内部的逐日拆分,所以画不出 7 天内部的走势;'
      + '程序没跑成的那天这条线会断开(总额是 AppLovin 给的,本地补不出来)。';
  } else if (pts < 2) {
    hint.innerHTML = '⚠ 目前只有 <b>' + pts + ' 天</b>数据,所以只能画成点。每天运行一次,累积到 2 天就会连成折线,一周后趋势就很清楚了。';
  } else {
    hint.innerHTML = '横轴 = 日期,纵轴 = 当日 spend。鼠标移到图上看具体数值;点图例可临时隐藏某条线。'
      + (D.estimatedDates.length ? ' <b>虚线 + 空心点 = 反推的估算值</b>(实线实心点 = AppLovin 实测)。' : '')
      + (manualMode() ? ' <b>手动选择模式下,图表只画你勾的素材,不受上方「按上传日期筛选」影响。</b>' : '');
  }
}

function drawSelbar(){
  const m = manualMode();
  document.getElementById('selbar').innerHTML =
    '<span class="mode">图表系列:' + (m
      ? '<b>手动选择 ' + picked.size + ' / ' + MAXSER + ' 条</b>'
      : '<b>自动</b>(所选范围内花费最高 ' + MAXSER + ' 条)') + '</span>'
    + '<button id="btnTop">用表格当前最上面 ' + MAXSER + ' 条替换</button>'
    + '<button id="btnClear"' + (m ? '' : ' disabled') + '>清空,回到自动</button>'
    + '<span class="hint" style="margin:0">↓ 在下面表格每行最左边打勾,即可把该素材加到折线图(最多 ' + MAXSER + ' 条,选择会记住)</span>';

  document.getElementById('btnClear').onclick = () => {
    picked.clear(); savePicked(); hidden.clear();
    topAssets = computeTop(); redrawAll();
  };
  document.getElementById('btnTop').onclick = () => {
    picked.clear();
    for (const a of lastRows.slice(0, MAXSER)) addPick(a.id);
    savePicked(); hidden.clear();
    topAssets = computeTop(); redrawAll();
  };
}

function redrawAll(){ drawSelbar(); drawHint(); drawLegend(); drawChart(); render(); }

function drawChart(){
  const svg = document.getElementById('chart');
  const W=1000,H=360,L=64,R=26,T=16,B=44;
  const vis = topAssets.filter(a=>!hidden.has(a.id));
  if(!vis.length){
    svg.innerHTML = '<text x="500" y="180" text-anchor="middle" font-size="13" fill="'+cssv('--muted')+'">'+
      '所选范围内没有该指标下产生花费的素材</text>';
    return;
  }
  const dates = D.dates;
  let max = 0;
  for(const a of vis) for(const v of valsOf(a)) if(v!==null && v>max) max=v;
  if(max<=0) max=1;
  // 好看的刻度
  const raw = max/4, mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const step = [1,2,2.5,5,10].map(m=>m*mag).find(s=>s>=raw) || mag*10;
  const yMax = Math.ceil(max/step)*step;
  const x = i => dates.length===1 ? (L+(W-L-R)/2) : L + (W-L-R)*i/(dates.length-1);
  const y = v => T + (H-T-B)*(1 - v/yMax);

  let g='';
  for(let v=0; v<=yMax+1e-9; v+=step){
    g += '<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y(v).toFixed(1)+'" y2="'+y(v).toFixed(1)+'" stroke="'+cssv('--grid')+'" stroke-width="1"/>';
    g += '<text x="'+(L-10)+'" y="'+(y(v)+4).toFixed(1)+'" text-anchor="end" font-size="11" fill="'+cssv('--muted')+'" style="font-variant-numeric:tabular-nums">'+(v>=1000?(v/1000)+'k':v)+'</text>';
  }
  // 缺失日画一条竖着的警示带,让断口一眼可见
  const missSet = new Set(D.missingDates);
  // 近7天指标下没有估算值(那天的总额本地补不出来),所以不标「估」,免得误导
  const estSet0 = new Set(metric==='day' ? D.estimatedDates : []);
  const halfStep = dates.length>1 ? (W-L-R)/(dates.length-1)/2 : 10;
  for(let i=0;i<dates.length;i++) if(missSet.has(dates[i])||estSet0.has(dates[i])){
    // 缺失日 = 黄底警示;估算日 = 更淡的底,提示这一天的数字是算出来的
    g += '<rect x="'+(x(i)-halfStep).toFixed(1)+'" y="'+T+'" width="'+(halfStep*2).toFixed(1)+
         '" height="'+(y(0)-T).toFixed(1)+'" fill="'+cssv('--warnbg')+'"'+
         (estSet0.has(dates[i])?' opacity="0.5"':'')+'/>';
  }
  g += '<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y(0)+'" y2="'+y(0)+'" stroke="'+cssv('--axis')+'" stroke-width="1"/>';
  const every = Math.max(1, Math.ceil(dates.length/9));
  dates.forEach((d,i)=>{ if(i%every===0||i===dates.length-1||missSet.has(d)||estSet0.has(d))
    g += '<text x="'+x(i).toFixed(1)+'" y="'+(H-B+20)+'" text-anchor="middle" font-size="11" fill="'+
         (missSet.has(d)?cssv('--down'):(estSet0.has(d)?cssv('--ink2'):cssv('--muted')))+'">'+
         d.slice(5)+(missSet.has(d)?' 缺':(estSet0.has(d)?' 估':''))+'</text>'; });

  g += '<line id="cross" x1="0" x2="0" y1="'+T+'" y2="'+y(0)+'" stroke="'+cssv('--axis')+'" stroke-width="1" opacity="0"/>';

  // 逐段画:跨缺口不连(不编造数据);碰到估算日画虚线 + 空心点(和实测一眼分得清)
  // 估算只发生在「昨日单日」这个指标上;近7天总额是 AppLovin 给的,本地没有估算值
  const estSet = new Set(metric==='day' ? D.estimatedDates : []);
  vis.forEach(a=>{
    const col = colorOf(a);
    const vv = valsOf(a);
    for(let i=1;i<dates.length;i++){
      const v0=vv[i-1], v1=vv[i];
      if(v0===null||v1===null||v0===undefined||v1===undefined) continue;   // 缺口两侧绝不连线
      const est = estSet.has(dates[i-1])||estSet.has(dates[i]);
      g += '<line x1="'+x(i-1).toFixed(1)+'" y1="'+y(v0).toFixed(1)+
           '" x2="'+x(i).toFixed(1)+'" y2="'+y(v1).toFixed(1)+
           '" stroke="'+col+'" stroke-width="2" stroke-linecap="round"'+
           (est?' stroke-dasharray="5 4"':'')+'/>';
    }
    vv.forEach((v,i)=>{
      if(v===null||v===undefined) return;
      const est = estSet.has(dates[i]);
      g += '<circle cx="'+x(i).toFixed(1)+'" cy="'+y(v).toFixed(1)+'" r="4" fill="'+
           (est?cssv('--surface'):col)+'" stroke="'+(est?col:cssv('--surface'))+'" stroke-width="2"/>';
    });
  });
  // 系列 ≤4 时直接在线尾标名字(浅色低对比色需要可见标签兜底)
  if(vis.length<=4 && dates.length>=1){
    vis.forEach(a=>{
      const col = colorOf(a);
      const vv = valsOf(a);
      let li=-1; vv.forEach((v,i)=>{ if(v!==null&&v!==undefined) li=i; });
      if(li<0) return;
      g += '<text x="'+(x(li)+8).toFixed(1)+'" y="'+(y(vv[li])+4).toFixed(1)+'" font-size="11" fill="'+col+'">'+esc(a.name.slice(0,16))+'</text>';
    });
  }
  svg.innerHTML = g;
}

let sortK='spend', sortDir=-1;
let lastRows=[];        // 表格当前显示的顺序,「用最上面 8 条替换」要用
const mvColOf = (a) => (a.mv===null||a.mv===undefined)
  ? (a.mk==='new' ? cssv('--up') : cssv('--muted'))
  : (a.mv>=0?cssv('--up'):cssv('--down'));
function spark(a){
  const vs=a.s; if(vs.filter(v=>v!==null).length<2) return '';
  const mx=Math.max(...vs.filter(v=>v!==null),0)||1;
  const n=vs.length, w=74,h=20;
  const pts=vs.map((v,i)=>v===null?null:[(n===1?w/2:i/(n-1)*(w-2)+1), h-1-(v/mx)*(h-3)]).filter(Boolean);
  const col = mvColOf(a);
  /* 外面包一层 span 带 id:鼠标悬停时用这个 id 现画一张大图(见 showPop) */
  return '<span class="sparkw" data-id="'+esc(String(a.id))+'" title="鼠标停上去可以放大">'
    + '<svg class="spark" viewBox="0 0 '+w+' '+h+'"><path d="M'+pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' L')+'" fill="none" stroke="'+col+'" stroke-width="1.5"/></svg></span>';
}

/* 悬停放大图:同一条趋势,画大一点、把两个对比窗口标出来。
   缺口照旧不连线,估算日照旧画虚线 —— 小图看不出来的东西,放大了必须看得出来。 */
function bigSpark(a){
  const W=360,H=130,L=8,R=8,T=10,B=22;
  const vs=a.s, dates=D.dates, n=dates.length;
  const has=vs.filter(v=>v!==null&&v!==undefined);
  if(!has.length) return '<svg viewBox="0 0 '+W+' '+H+'"><text x="'+(W/2)+'" y="'+(H/2)+
    '" text-anchor="middle" font-size="12" fill="'+cssv('--muted')+'">没有可画的数据</text></svg>';
  const mx=Math.max(...has,0)||1;
  const x=i=>n===1?(L+(W-L-R)/2):L+(W-L-R)*i/(n-1);
  const y=v=>T+(H-T-B)*(1-v/mx);
  const half=n>1?(W-L-R)/(n-1)/2:8;
  const est=new Set(D.estimatedDates||[]);
  const inA=new Set((D.mv&&D.mv.winA)||[]), inB=new Set((D.mv&&D.mv.winB)||[]);
  let g='';
  for(let i=0;i<n;i++){
    const c = inA.has(dates[i]) ? cssv('--upbg') : (inB.has(dates[i]) ? cssv('--grid') : null);
    if(c) g+='<rect x="'+(x(i)-half).toFixed(1)+'" y="'+T+'" width="'+(half*2).toFixed(1)+
      '" height="'+(H-T-B)+'" fill="'+c+'"/>';
  }
  g+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y(0)+'" y2="'+y(0)+'" stroke="'+cssv('--axis')+'" stroke-width="1"/>';
  const col=mvColOf(a);
  for(let i=1;i<n;i++){
    const v0=vs[i-1], v1=vs[i];
    if(v0===null||v1===null||v0===undefined||v1===undefined) continue;
    g+='<line x1="'+x(i-1).toFixed(1)+'" y1="'+y(v0).toFixed(1)+'" x2="'+x(i).toFixed(1)+'" y2="'+y(v1).toFixed(1)+
      '" stroke="'+col+'" stroke-width="2" stroke-linecap="round"'+
      ((est.has(dates[i-1])||est.has(dates[i]))?' stroke-dasharray="4 3"':'')+'/>';
  }
  vs.forEach((v,i)=>{ if(v===null||v===undefined) return;
    const e=est.has(dates[i]);
    g+='<circle cx="'+x(i).toFixed(1)+'" cy="'+y(v).toFixed(1)+'" r="3" fill="'+(e?cssv('--surface'):col)+
      '" stroke="'+(e?col:cssv('--surface'))+'" stroke-width="1.5"/>'; });
  const every=Math.max(1,Math.ceil(n/6));
  dates.forEach((d,i)=>{ if(i%every===0||i===n-1)
    g+='<text x="'+x(i).toFixed(1)+'" y="'+(H-B+15)+'" text-anchor="middle" font-size="10" fill="'+
      cssv('--muted')+'">'+d.slice(5)+'</text>'; });
  g+='<text x="'+L+'" y="'+(T+9)+'" font-size="10" fill="'+cssv('--muted')+'">峰值 '+money(mx)+'</text>';
  return '<svg viewBox="0 0 '+W+' '+H+'">'+g+'</svg>';
}

/* 涨跌徽章:挂在素材名后面。底色只是辅助 —— 色弱看不出绿和红的差别,
   所以判定结果必须有文字,具体数字放在 title 里(鼠标悬停可看)。 */
function mvBadge(a){
  if(!a.fz) return '';
  const up=a.fz==='up';
  const pct=(a.mv===null||a.mv===undefined)?(a.mk==='new'?' 从0起量':'')
    :' '+(a.mv>=0?'▲':'▼')+Math.abs(a.mv).toFixed(1)+'%';
  const tip='前三天日均 '+(a.a3===null||a.a3===undefined?'—':money(a.a3))
    + ' vs 上一轮三天日均 '+(a.b3===null||a.b3===undefined?'—':money(a.b3))
    + ';昨日 '+money(a.spend||0)+'(只用来卡门槛)'
    + (MVR&&MVR.frozen?'。判定定于 '+MVR.refreshedLabel+',下次刷新 '+MVR.nextLabel:'');
  return '<span class="badge" style="border-color:var(--'+(up?'up':'down')+');color:var(--'+(up?'up':'down')+')"'
    + ' title="'+esc(tip)+'">'+(up?'快速增长':'严重下跌')+pct+'</span>';
}
function render(){
  const q=document.getElementById('q').value.trim().toLowerCase();
  const showzero=document.getElementById('showzero').checked;
  const upOnly=document.getElementById('uponly').checked;
  const dnOnly=document.getElementById('downonly').checked;
  /* 两个都勾 = 「涨的和跌的都看」(取并集),而不是「既涨又跌」(那永远是空的) */
  const mvOk=(a)=> (!upOnly&&!dnOnly) ? true
    : ((upOnly&&a.fz==='up')||(dnOnly&&a.fz==='down'));
  const base=scoped();
  let rows=base.filter(a=>(showzero||a.spend>0||(a.spend7||0)>0)&&(!q||a.name.toLowerCase().includes(q))
    &&mvOk(a));
  const rank=new Map(D.assets.map((a,i)=>[a.id,i+1]));   // 名次始终按大盘算,筛选后不重编号
  rows.sort((p,q2)=>{
    if(sortK==='rank') return (rank.get(p.id)-rank.get(q2.id))*(sortDir===-1?1:-1);
    if(sortK==='name') return p.name.localeCompare(q2.name)*(sortDir===-1?-1:1);
    if(sortK==='up') return String(p.up).localeCompare(String(q2.up))*sortDir;
    /* 空值一律排最后(升序时最前) —— 「没算出来」不该混在「跌了 90%」中间 */
    const g=(o,k)=>{
      if(k==='mv') return (o.mv===null||o.mv===undefined)?(o.mk==='new'?1e11:-1e12):o.mv;
      const v=o[k];
      return (v===null||v===undefined)?-1:v;
    };
    return (g(p,sortK)-g(q2,sortK))*sortDir;
  });
  lastRows=rows;
  document.getElementById('cnt').textContent='显示 '+rows.length+' / 所选范围 '+base.length+' 条(大盘 '+D.assets.length+' 条)';
  document.getElementById('noneMsg').style.display=rows.length?'none':'block';
  document.getElementById('tb').innerHTML=rows.map(a=>{
    /* 底色 = 冻结判定(a.fz),不是今天最新的 a.mflag —— 名单每周二/周五才换,
       底色必须和上面「涨跌素材」区块里的名单完全一致,否则两处对不上就没人敢信。 */
    const hl=a.fz==='up'?' class="mup"':(a.fz==='down'?' class="mdn"':'');
    const fresh=a.age!==null&&a.age<NA.days;
    return '<tr'+hl+'>'+
      '<td class="ck"><input type="checkbox" data-id="'+a.id+'"'+(picked.has(a.id)?' checked':'')+
        ' title="加入折线图"></td>'+
      '<td>'+rank.get(a.id)+'</td>'+
      '<td class="nm">'+esc(a.name)+mvBadge(a)+
        (a.src==='差值'?'<span class="badge" style="border-color:var(--s2);color:var(--s2)" title="这一行的金额是「该素材在其它 App 上的花费」,不是它的全部花费">差值·其它App</span>':'')+
        (a.status&&a.status!=='ACTIVE'?'<span class="badge">'+esc(a.status)+'</span>':'')+'</td>'+
      '<td class="n" style="color:var(--ink2)">'+(a.up||'—')+
        (fresh?'<span class="badge" style="border-color:var(--s3);color:var(--s3)">新 '+a.age+'天</span>':'')+'</td>'+
      '<td class="n">'+money(a.spend)+'</td>'+
      '<td class="n">'+avgCell(a.a3,a.ua)+'</td>'+
      '<td class="n" style="color:var(--ink2)">'+avgCell(a.b3,a.ub)+'</td>'+
      '<td class="n">'+mvCell(a)+'</td>'+
      (SV.available?'<td class="n">'+(a.spend7===null?dashSpan:money(a.spend7))+'</td>':'')+
      '<td class="n">'+intf(a.imp)+'</td><td class="n">'+intf(a.clk)+'</td><td class="n">'+a.ctr.toFixed(2)+'%</td>'+
      '<td>'+spark(a)+'</td></tr>';
  }).join('');
}

  '<br>· <span style="background:var(--upbg);padding:1px 7px;border-radius:4px;border-left:3px solid var(--up)">绿底</span> = 快速增长,'+
  '<span style="background:var(--downbg);padding:1px 7px;border-radius:4px;border-left:3px solid var(--down)">红底</span> = 严重下跌;'+
  '素材名后面还有文字徽章(鼠标停上去能看到具体两个日均)。'+
  '<br>· <b>昨日的金额只用来卡门槛,不参与涨跌计算</b> —— 所以会出现「昨日掉到 0」却不标红的情况'+
  '(昨日=0 过不了门槛),也会出现「刚重新起量」的素材因为前三天日均还没追上而标红。'+
  '这是按你定的口径来的,数字就摆在「昨日 spend / 前三天日均 / 上一轮三天日均」三列里,可以自己对。'+
  '<br>· 窗口里整天没抓到数据的日子不参与日均(分母也少 1),一个窗口至少要有 '+HL.minWinDays+
  ' 天有效数据才判定;不够就显示「—」,不猜。'+
  (MVR?'<br>· <b>判定每'+MVR.refreshDaysLabel+'才刷新一次</b>:上面的「涨跌素材」名单、表格底色、'+
    '两个筛选框都读同一份快照(本次定于 '+MVR.refreshedLabel+',下次 '+MVR.nextLabel+'),'+
    '快照存在 <code>'+dd+'/movers.json</code>。金额数字还是每天更新的,'+
    '所以非刷新日可能出现「底色是绿的、当天的变化列却是 ▼」—— 这是冻结的正常表现,不是算错了。':'')+'<br>'+
  '所有明细(含 spend 为 0 的素材)都完整存在 <code>'+dd+'/history.csv</code>'+(SV.available?' 和 <code>'+dd+'/history-last_7_days.csv</code>':'')+',可用 Excel 打开。<br>'+
  '注意:AppLovin 的金额口径是 UTC 时间,且会随「包名筛选」变化。本报告的口径是:'+
  (D.meta.packages.length ? esc(D.meta.packages.join(' + ')) : '不按包名筛选(全账户金额)')+
  (D.meta.nameTokens.length ? ',素材名含 '+esc(D.meta.nameTokens.join(' 或 ')) : '')+
  (D.meta.onlyNoPkg ? ',且只含未关联包名的素材' : '')+
  ',素材类型 '+esc(D.meta.resourceType)+'。';
}

/* ---------- 切换数据集:换掉 D,然后整页重画 ---------- */
/* 每套数据集的筛选/排序/勾选互不影响,所以切过去时把视图状态重置成默认,
   免得「HTML 那边按近7天排序」的状态莫名其妙带回视频那边 */
function useDataset(k){
  dsKey = (k === 'html' && DSETS.html) ? 'html' : 'video';
  D = DSETS[dsKey];
  S = D.summary; SV = D.seven; NA = D.newAssets;
  /* 涨跌门槛。老报告数据里没有 hl / mv 字段,给一份兜底,免得整段脚本报错白屏 */
  HL = D.hl || {thr:30,floorNew:0,floorOld:0,newDays:NA.days,winDays:3,minWinDays:2,freshUpOnly:true};
  if (!D.mv) D.mv = {winA:[],winB:[],winDays:HL.winDays||3,minWinDays:HL.minWinDays||2,
    thr:HL.thr,floorNew:HL.floorNew,floorOld:HL.floorOld,newDays:HL.newDays,
    freshUpOnly:HL.freshUpOnly!==false,refreshDays:[2,5],estA:[],estB:[],missA:[],missB:[]};
  MVR = D.movers || null;
  MVIT = new Map((MVR&&MVR.items?MVR.items:[]).map(it=>[String(it.id), it]));
  /* 悬停放大图按 id 找素材;dataset.id 拿到的是字符串,这里的 key 必须也是字符串 */
  AMAP = new Map(D.assets.map(a=>[String(a.id), a]));
  FILTERS = [
    ['all', '全部',        () => true],
    ['d14', '近 '+NA.days+' 天上传', (a) => a.age!==null && a.age < NA.days],
  ];
  fkey = 'all';
  metric = SV.available ? metric : 'day';
  sortK = 'spend'; sortDir = -1;
  hidden.clear();
  loadPicked();
  topAssets = computeTop();
  const q = document.getElementById('q'); if (q) q.value = '';
  const cu = document.getElementById('uponly'); if (cu) cu.checked = false;
  const cd = document.getElementById('downonly'); if (cd) cd.checked = false;
  hidePop();
  /* 差值一节只属于视频那套(它是「视频素材在其它 App 上的花费」),切到 HTML 就藏起来 */
  document.getElementById('diffSection').style.display = (dsKey === 'video') ? '' : 'none';
  drawDsbar(); drawSub(); drawWarn(); drawMovers(); drawTableHead(); drawFoot();
  drawFbar(); render(); drawMbar(); drawSelbar(); drawHint(); drawLegend(); drawChart();
}

useDataset('video');
window.addEventListener('resize', drawChart);

/* ==================================================================
   差值一节:该素材在「其它 App」上的花费
   = 不筛包名的 spend − 筛对比包名的 spend
   这一节有自己独立的图表/表格代码,故意不复用上面那套 —— 上面那套已经跑通,不去动它。
   ================================================================== */
function renderDiff(){
  if(!DIFF || !DIFF.assets.length){
    if(DIFF) document.getElementById('diffSection').innerHTML =
      '<div class="card"><h2>包名筛选差值(其它 App 上的花费)</h2>'+
      '<p class="hint">当前没有任何素材出现差值 —— 说明所有素材的花费都只来自 '+
      DIFF.comparePkgs.map(esc).join(' / ')+'。</p></div>';
    return;
  }
  const S2 = DIFF.summary;

  const box = document.createElement('div');
  box.innerHTML =
    '<div class="card">'
    + '<h2>包名筛选差值 — 明细</h2>'
    + '<p class="hint">'
    +   '这 '+S2.count+' 条素材<b>已经并进上面的主图表和主表格了</b>(表格里带「差值·其它App」徽章),'
    +   '这里只是把做差的原始数据摊开给你核对。'
    +   '<br>同一次运行里抓两份数据做差:<b>不按包名筛选的 spend − 按 '
    +   DIFF.comparePkgs.map(esc).join(' / ') + ' 筛选的 spend</b>,'
    +   '差出来的就是这条素材花在<b>别的 App</b> 上的钱 —— 主报表(只统计 petsharbor)看不到它。'
    +   '<br>展示量和点击同样可加,直接做差;<b>CTR 不可加</b>,是用「差值点击 ÷ 差值展示量」算出来的,'
    +   '也就是它在其它 App 上的 CTR。差值展示量为 0 时显示「—」。'
    +   '<br>负差值一律丢弃(那是 AppLovin 事后修正数据造成的噪声,不是真实差值),日志里会写明丢了几条。'
    + '</p>'
    + '<div class="tiles" id="d_tiles"></div>'
    + '<div class="tblwrap" style="margin-top:18px"><table id="d_tbl"><thead><tr>'
    +   '<th>#</th><th class="nm">素材名</th><th>上传日期</th>'
    +   '<th>昨日<br>包内 spend</th><th>昨日<br>全账户 spend</th><th>昨日差值<br>(其它App)</th><th>差值<br>占比</th>'
    +   '<th>昨日差值<br>展示量</th><th>昨日差值<br>点击</th><th>昨日差值<br>CTR</th>'
    +   '<th>近7天<br>差值</th>'
    + '</tr></thead><tbody id="d_tb"></tbody></table></div>'
    + '</div>';
  document.getElementById('diffSection').appendChild(box);

  /* ---- 统计块 ---- */
  document.getElementById('d_tiles').innerHTML = [
    ['其它 App 花费(昨日)', money(S2.totalSpend),
      DIFF.prev ? '前一天 '+money(S2.prevTotal)+' · '+deltaHtml(S2.totalDeltaPct) : '首次记录'],
    ['其它 App 花费(近7天)', DIFF.seven.available ? money(S2.spend7) : '—',
      DIFF.seven.available ? esc(DIFF.seven.window) : '需要近7天数据'],
    ['有差值的素材', intf(S2.count)+' <span style="font-size:14px;color:var(--muted)">条</span>',
      '其余素材的花费只来自对比包名,差值为 0'
      + (DIFF.dropped.length ? '<br>另有 '+DIFF.dropped.length+' 条昨日无差值(只在近7天窗口里有零星金额),已剔除' : '')],
    ['占该素材总花费', (S2.allSum>0 ? (S2.totalSpend/S2.allSum*100).toFixed(1) : '0')+'%',
      '这些素材全账户共花 '+money(S2.allSum)+',其中包内 '+money(S2.baseSum)],
    ['差值展示量 / 点击', intf(S2.imp)+' / '+intf(S2.clk),
      '差值CTR '+(S2.imp>0 ? (S2.clk/S2.imp*100).toFixed(2)+'%' : '—')],
  ].map(([l,v,n])=>'<div class="tile"><div class="lab">'+l+'</div><div class="val">'+v+'</div><div class="note">'+n+'</div></div>').join('');

  /* ---- 表格 ---- */
  const dash = '<span style="color:var(--muted)">—</span>';
  document.getElementById('d_tb').innerHTML = DIFF.assets.map((a,i)=>{
    const hasDay = a.spend > 0;
    const share = (hasDay && a.all>0) ? (a.spend/a.all*100).toFixed(1)+'%' : dash;
    const ctr = a.imp>0 ? a.ctr.toFixed(2)+'%' : dash;
    return '<tr><td>'+(i+1)+'</td>'
      +'<td class="nm">'+esc(a.name)+'</td>'
      +'<td class="n" style="color:var(--ink2)">'+(a.up||'—')+'</td>'
      +'<td class="n" style="color:var(--ink2)">'+(hasDay?money(a.base):dash)+'</td>'
      +'<td class="n" style="color:var(--ink2)">'+(hasDay?money(a.all):dash)+'</td>'
      +'<td class="n" style="font-weight:600">'+(hasDay?money(a.spend):dash)+'</td>'
      +'<td class="n">'+share+'</td>'
      +'<td class="n">'+(hasDay?intf(a.imp):dash)+'</td>'
      +'<td class="n">'+(hasDay?intf(a.clk):dash)+'</td>'
      +'<td class="n">'+ctr+'</td>'
      +'<td class="n" style="font-weight:600">'+(a.spend7===null||a.spend7===undefined?dash:money(a.spend7))+'</td>'
      +'</tr>';
  }).join('');

  /* 差值这一节不再单独画图 —— 这几条素材已经并进上面的主图表了 */
}
renderDiff();
</script>
</body></html>
