<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pets 数据报表（iOS / Android）</title>
<style>
  html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:#f8f9ff}
  .bar{display:flex;align-items:center;gap:14px;padding:10px 20px;background:#fff;border-bottom:2px solid #888;box-shadow:0 1px 4px rgba(0,0,0,.06)}
  .bar .title{font-size:16px;font-weight:700;color:#333;margin-right:8px}
  .plat-btn{padding:8px 26px;border:none;background:#e8e8e8;border-radius:8px;font-size:15px;font-weight:600;color:#555;cursor:pointer;transition:.15s}
  .plat-btn:hover{background:#dcdcff}
  .plat-btn.active{background:#555;color:#fff}
  .spacer{flex:1}
  .open-new{font-size:13px;color:#5a5af0;text-decoration:none}
  .open-new:hover{text-decoration:underline}
  .frame-wrap{position:absolute;top:55px;left:0;right:0;bottom:0}
  iframe{width:100%;height:100%;border:none;display:block}
</style>
</head>
<body>
<div class="bar">
  <span class="title">📊 Pets 数据报表</span>
  <button class="plat-btn active" id="btn-ios"     onclick="showPlat('ios')">iOS</button>
  <button class="plat-btn"        id="btn-android" onclick="showPlat('android')">Android</button>
  <button class="plat-btn"        id="btn-both"    onclick="showPlat('both')">双端</button>
  <span class="spacer"></span>
  <a class="open-new" id="open-new" href="#" target="_blank" rel="noopener">↗ 新窗口打开当前平台</a>
</div>
<div class="frame-wrap">
  <iframe id="report" src="" title="report"></iframe>
</div>
<script>
  var URLS = {
    ios:     "https://kaidi915.github.io/UA_2/pets_ios%E8%BF%87%E5%8E%BB30%E5%A4%A9.html",
    android: "https://kaidi915.github.io/UA_2/pets_android%E8%BF%87%E5%8E%BB30%E5%A4%A9.html",
    both:    "https://kaidi915.github.io/UA_2/pets_%E5%8F%8C%E7%AB%AF%E8%BF%87%E5%8E%BB30%E5%A4%A9.html"
  };
  function showPlat(p){
    document.getElementById('report').src = URLS[p];
    document.getElementById('open-new').href = URLS[p];
    document.getElementById('btn-ios').classList.toggle('active', p==='ios');
    document.getElementById('btn-android').classList.toggle('active', p==='android');
    document.getElementById('btn-both').classList.toggle('active', p==='both');
    try { history.replaceState(null, '', '#'+p); } catch(e){}
  }
  // 支持 #android / #both 直达，默认 iOS
  var _h = location.hash.replace('#','');
  showPlat(URLS[_h] ? _h : 'ios');
</script>
</body>
</html>
